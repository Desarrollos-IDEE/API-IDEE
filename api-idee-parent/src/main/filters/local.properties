# CSS
mobile.width=768

# zooms
maxZoom=28
minZoom=0
defaultZoom=3
activateResolutions=false

# DEPLOYMENT
api-idee.url=http://localhost:8080/api-idee/
api-idee.proxy.url=//localhost:8080/api-idee/api/proxy
api-idee.proxy_post.url=//localhost:8080/api-idee/proxyPost
api-idee.static_resources.url=https://componentes.idee.es/estaticos
api-idee.theme.url=//localhost:8080/api-idee/assets/
plugins.external.base.url=https://componentes.idee.es/api-idee-communityplugins

# LAYERS
baseLayer=QUICK*Base_IGNBaseTodo_TMS
terrain.default=QUICK*MDT_TERRAIN
services=WMS,WMS_FULL,KML,LayerGroup,WFST,WMTS,GeoJSON,GeoTIFF,MBTilesVector,MBTiles,MapLibre,MVT,OGCAPIFeatures,OSM,TMS,XYZ,GenericRaster,GenericVector,Vector,Terrain,Tiles3D,GeoPackage,GeoPackageTile
wmc.urls=https://componentes.idee.es/estaticos/Datos/WMC/mapa.xml,https://componentes.idee.es/estaticos/Datos/WMC/hibrido.xml,https://componentes.idee.es/estaticos/Datos/WMC/satelite.xml,https://componentes.idee.es/estaticos/Datos/WMC/context_cdau_callejero.xml,https://componentes.idee.es/estaticos/Datos/WMC/context_cdau_hibrido.xml,https://componentes.idee.es/estaticos/Datos/WMC/context_cdau_satelite.xml,https://componentes.idee.es/estaticos/Datos/WMC/contextCallejeroCache.xml,https://componentes.idee.es/estaticos/Datos/WMC/contextCallejero.xml,https://componentes.idee.es/estaticos/Datos/WMC/callejero2011cache.xml,https://componentes.idee.es/estaticos/Datos/WMC/ortofoto2011cache.xml,https://componentes.idee.es/estaticos/Datos/WMC/hibrido2011cache.xml,https://componentes.idee.es/estaticos/Datos/WMC/contextOrtofoto.xml
wmc.predefinedNames=mapa,hibrido,satelite,cdau,cdau_hibrido,cdau_satelite,callejerocacheado,callejero,callejero2011cache,ortofoto2011cache,hibrido2011cache,ortofoto
wmc.names=Mapa,Hibrido,Satelite,Callejero,Hibrido,Satelite,mapa callejero cache,mapa del callejero,Callejero,Ortofoto,Híbrido,mapa ortofoto

# PROJECTION
api-idee.proj.default=EPSG:3857

# CONTROLS
controls=scale,scaleline,panzoombar,panzoom,location,getfeatureinfo,rotate,backgroundlayers,attributions,implementationswitcher
controls.default=
zoomLocation=16

# WASM
sql_wasm.url=//localhost:8080/api-idee/wasm/

# VERSIONS
versions.names=1.1.0,latest

# rest configuration
proxy.host=
proxy.port=


