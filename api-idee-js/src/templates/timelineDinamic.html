<div class="m-timeline-container m-timeline-dynamic {{sizeWidthDinamic}}">
    <div class="m-timeline-title">{{translations.title}}</div>
    <div class="m-timeline-notice" role="status" hidden></div>
    <div>
        <div>
            <div>  <!-- Movil class rotate -->
                <!-- Basic structure -->
                <div class='wrap' style='--a: -30; --b: 20; --min: -50; --max: 50'>
                    <input class='m-timeline-range-init' type='range' min='0' value='0' max='0' aria-label="{{translations.initValue}}"/>
                    <input class='m-timeline-range-end' type='range' min='0' value='0' max='0' aria-label="{{translations.endValue}}"/>
                </div>
            </div>

            <div class='slider-tags-dinamic'>
                <div>
                    <label for="{{ids.init}}">{{translations.initValue}}: </label>
                    <input id="{{ids.init}}" class="m-timeline-date-init" type="text">
                </div>

                <div>
                    <label for="{{ids.end}}">{{translations.endValue}}: </label>
                    <input id="{{ids.end}}" class="m-timeline-date-end" type="text">
                </div>
            </div>
        </div>
        <div class="m-timelineDinamic-button">

            <select class="selectDinamicLayer m-timeline-layer-select" name="dinamicLayer" aria-label="{{translations.title}}">
            </select>

            <button type="button" class="timelineDinamic-control-play m-timelineDinamic-back" title="Iniciar paso del tiempo"><<</button>
            <button type="button" class="timelineDinamic-control-play m-timelineDinamic-play" title="Iniciar paso del tiempo">Play/Pausa</button>
            <button type="button" class="timelineDinamic-control-play m-timelineDinamic-before" title="Iniciar paso del tiempo">>></button>
            <!-- Parametrización del valor incremento de paso -->
        </div>
    </div>
</div>
