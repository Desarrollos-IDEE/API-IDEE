<div class="m-timeline-container">
    <div class="m-timeline-title">{{translations.title}}</div>
    <div class="m-timeline-notice" role="status" hidden></div>
    <div class="div-m-timeline-panel">
        <div class="div-m-timeline-slider">
            <input type="range" min="0" max="100" value="0" step="{{inputRange.step}}" class="m-timeline-slider-input" aria-label="{{translations.title}}"></input>
            <div class='slider-tags'></div>
        </div>
        <div class="m-timeline-controls">
            <div class="m-timeline-layer-selectors">
                <select class="m-timeline-names" aria-label="{{translations.title}}">
                </select>
                <select class="m-timeline-names-next" aria-label="{{translations.title}}">
                </select>
            </div>
            <div class="m-timeline-button">
                <div class="m-timeline-play timeline-control-siguiente g-cartografia-control-siguiente"
                    title="Iniciar paso del tiempo"></div>
            </div>
        </div>
    </div>
</div>
