<div class="m-rastermanagement-geoprocess-inner">
    <div id="m-rastermanagement-geoprocess-tabs" role="tablist" aria-label="{{geoprocessSection}}">
        <div id="m-rastermanagement-histograms-tab" class="m-rastermanagement-tab active" role="tab" tabindex="0" aria-selected="true" aria-controls="m-rastermanagement-histograms-tab-content">{{histograms}}</div>
        <div id="m-rastermanagement-calculator-tab" class="m-rastermanagement-tab" role="tab" tabindex="0" aria-selected="false" aria-controls="m-rastermanagement-calculator-tab-content">{{rasterCalculator}}</div>
    </div>
    <div id="m-rastermanagement-geoprocess-contents">
        <div id="m-rastermanagement-histograms-tab-content" class="m-rastermanagement-tab-content" role="tabpanel" aria-labelledby="m-rastermanagement-histograms-tab">
            <div id="m-rastermanagement-histograms-container"></div>
        </div>
        <div id="m-rastermanagement-calculator-tab-content" class="m-rastermanagement-tab-content hidden" role="tabpanel" aria-labelledby="m-rastermanagement-calculator-tab">
            <div id="m-rastermanagement-calculator-container"></div>
        </div>
    </div>
</div>
