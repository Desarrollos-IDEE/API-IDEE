<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="idee" content="yes">
  <title>WFSTControls v2 Production TEST</title>
  <link href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />
  <link href="../dist/wfstcontrols.ol.min.css" rel="stylesheet" />
  <style>
    html,
    body,
    #mapjs {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="mapjs" class="container"></div>

  <script src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
  <script src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>
  <script src="../dist/wfstcontrols.ol.min.js"></script>
  <script>
    const map = IDEE.map({
      container: 'mapjs',
    });

    const wfsLayer = new IDEE.layer.WFS({
      url: 'https://www.ign.es/wfs/redes-geodesicas?',
      legend: 'Red Geodésica Nacional por Técnicas Espaciales (REGENTE)',
      name: 'RED_REGENTE',
      geometry: 'POINT',
      extract: true,
    });

    map.addWFS(wfsLayer);

    const mp = new IDEE.plugin.WFSTControls({
      position: 'right',
      collapsed: true,
      order: 1,
      tooltip: 'Herramientas de edición',
      features: 'drawfeature,modifyfeature,deletefeature,editattribute',
      layername: 'RED_REGENTE',
      geometry: 'POINT',
      proxy: {
        status: true,
        disable: false,
      },
    });

    map.addPlugin(mp);
    window.map = map;
    window.mp = mp;
  </script>
</body>
</html>
