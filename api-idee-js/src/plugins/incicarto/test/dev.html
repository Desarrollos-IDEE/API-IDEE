<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>Incicarto TEST</title>
    <link type="text/css" rel="stylesheet" href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css" />
    <link type="text/css" rel="stylesheet"
        href="https://componentes-beta.idee.es/api-idee/plugins/backimglayer/backimglayer.ol.min.css" />
    <link type="text/css" rel="stylesheet" href="https://componentes-beta.idee.es/api-idee/plugins/fulltoc/fulltoc.ol.min.css" />
    <link type="text/css" rel="stylesheet"
        href="https://componentes-beta.idee.es/api-idee/plugins/measurebar/measurebar.ol.min.css" />
    <link type="text/css" rel="stylesheet"
        href="https://componentes-beta.idee.es/api-idee/plugins/information/information.ol.min.css" />
    <link type="text/css" rel="stylesheet"
        href="https://componentes-beta.idee.es/api-idee/plugins/infocoordinates/infocoordinates.ol.min.css" />
    <link type="text/css" rel="stylesheet"
        href="https://componentes-beta.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.css" />
</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form" style="max-height: 14.5rem;">
            <div>
                <label for="selectPosicion">Posición del panel "position"</label>
                <select name="position" id="selectPosicion">
                    <option value="" selected="selected"></option>
                    <option value="left">Izquierda (left)</option>
                    <option value="right">Derecha (right)</option>
                </select>
            </div>
            <div>
                <label for="inputOrder"
                    title="Define en que posición del panel debe aparecer en el conjunto de controles o plugins">Orden
                    entre controles / plugins "order"</label>
                <input type="number" name="order" id="inputOrder" list="orderSug" value="-1">
            </div>
            <div>
                <label for="inputTooltip" title="Título ilustrativo que aporta información adicional">Título
                    "tooltip"</label>
                <input type="text" name="tooltip" id="inputTooltip" list="tooltipSug" value="">
            </div>
            <div>
                <label for="selectCollapsed">Panel colapsado "collapsed"</label>
                <select name="collapsed" id="selectCollapsed">
                    <option value='' selected="selected"></option>
                    <option value="true">true</option>
                    <option value="false">false</option>
                </select>
            </div>
            <div>
                <label for="inputPrefixSubject">Prefijo email "prefixSubject"</label>
                <input type="text" id="inputPrefixSubject" value="Incidencia cartogrfica - " />
            </div>
            <div>
                <label for="selectInterfazmode">Tipo de interfaz "interfazmode"</label>
                <select name="interfazmode" id="selectInterfazmode">
                    <option value=""></option>
                    <option value="simple">simple</option>
                    <option value="advance" selected>advance</option>
                </select>
            </div>
            <div>
                <label for="selectProfileGraphs">Gráficas del perfil "profileGraphs"</label>
                <select name="profileGraphs" id="selectProfileGraphs">
                    <option value="" selected></option>
                    <option value="profile">profile</option>
                    <option value="elevationGain">elevationGain</option>
                    <option value="profile,elevationGain">profile,elevationGain</option>
                </select>
            </div>
            <div>
                <label for="inputErrorList">Lista de errores "errorList" (separado por ,)</label>
                <input type="text" name="errorList" id="inputErrorList" value="No especificado,Omisión,Otros" />
            </div>
            <div>
                <label for="inputProductList">Lista de productos "productList" (separado por ,)</label>
                <input type="text" name="productList" id="inputProductList"
                    value="No especificado,IGN Base,Otros productos"/>
            </div>
            <div>
                <label for="inputBuzones">Parámetro "buzones"</label>
                <textarea id="inputBuzones" rows="4">
                [
                  {
                    "name": "Cartografía",
                    "email": "cartografia.ign@mitma.es"
                  },
                  {
                    "name": "Atlas Nacional de España",
                    "email": "ane@mitma.es"
                  },
                  {
                    "name": "Fototeca",
                    "email": "fototeca@cnig.es"
                  }
                ]
                </textarea>
            </div>
            <div>
                <label for="inputControllist">Parámetro "controllist"</label>
                <textarea id="inputControllist" rows="4">
                [
                  {
                    "id": "themeList",
                    "name": "Temas de errores",
                    "mandatory": true
                  },
                  {
                    "id": "errorList",
                    "name": "Tipos de errores",
                    "mandatory": true
                  },
                  {
                    "id": "productList",
                    "name": "Lista de productos",
                    "mandatory": true
                  }
                ]
                </textarea>
            </div>
            <div>
                <label for="inputThemeList">Parámetro "themeList"</label>
                <textarea id="inputThemeList" rows="4">
                [
                  {
                    "idTheme": 1,
                    "nameTheme": "No especificado",
                    "emailTheme": "consultas@cnig.es"
                  },
                  {
                    "idTheme": 2,
                    "nameTheme": "Relieve",
                    "emailTheme": "cartografia.ign@mitma.es"
                  }
                ]
                </textarea>
            </div>
        </div>
        <div class="m-test-buttons">
            <button id="removeButton">Eliminar Control</button>
        </div>
    </div>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>
    <script type="text/javascript"
        src="https://componentes-beta.idee.es/api-idee/plugins/backimglayer/backimglayer.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/plugins/fulltoc/fulltoc.ol.min.js"></script>
    <script type="text/javascript"
        src="https://componentes-beta.idee.es/api-idee/plugins/measurebar/measurebar.ol.min.js"></script>
    <script type="text/javascript"
        src="https://componentes-beta.idee.es/api-idee/plugins/information/information.ol.min.js"></script>
    <script type="text/javascript"
        src="https://componentes-beta.idee.es/api-idee/plugins/infocoordinates/infocoordinates.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/plugins/mousesrs/mousesrs.ol.min.js"></script>
    <script type="text/javascript" src="/main.js"></script>
</body>

</html>
