<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="api-idee" content="yes">
    <title>FilteredSearch Production TEST</title>
    <link href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />
    <link href="../dist/filteredsearch.ol.min.css" rel="stylesheet" />
</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form">
            <div>
                <label for="selectPosition" title="Posición del plugin sobre el mapa">Posición "position"</label>
                <select name="position" id="selectPosition">
                    <option value="left" selected="selected">left</option>
                    <option value="right">right</option>
                </select>
            </div>
            <div>
                <label for="selectCollapsed" title="Colapsado al inicio">Colapsado "collapsed"</label>
                <select name="collapsed" id="selectCollapsed">
                    <option value="true" selected="selected">true</option>
                    <option value="false">false</option>
                </select>
            </div>
            <div>
                <label for="inputOrder">Orden "order"</label>
                <input type="number" name="order" id="inputOrder" value="0">
            </div>
            <div>
                <label for="inputTooltip">Tooltip</label>
                <input type="text" name="tooltip" id="inputTooltip" value="Búsqueda filtrada">
            </div>
        </div>
        <div class="m-test-buttons">
            <button name="eliminar" class="m-test-button" id="removeButton">Eliminar Plugin</button>
        </div>
    </div>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>
    <script type="text/javascript" src="../dist/filteredsearch.ol.min.js"></script>
    <script type="text/javascript">
        IDEE.language.setLang(window.localStorage.getItem('language') || 'es');

        const map = IDEE.map({
            container: 'mapjs',
            center: { x: 360020, y: 4149045 },
            zoom: 5,
            layers: [
                'WMTS*http://www.ideandalucia.es/geowebcache/service/wmts?*toporaster*SIG-C:25830*WMTS*true',
            ],
        });
        window.map = map;

        const campamentos = new IDEE.layer.WFS({
            url: 'http://geostematicos-sigc.juntadeandalucia.es/geoserver/sepim/ows',
            name: 'sepim:campamentos',
            legend: 'CapaWFS',
            geometry: 'POINT',
            extract: true,
        });
        map.addWFS(campamentos);

        let mp = null;

        const createPlugin = (options) => {
            mp = new IDEE.plugin.FilteredSearch(options);
            window.mp = mp;
            map.addPlugin(mp);
        };

        const removePlugin = () => {
            if (mp) {
                map.removePlugins(mp);
                mp = null;
            }
        };

        const selectPosition = document.getElementById('selectPosition');
        const selectCollapsed = document.getElementById('selectCollapsed');
        const inputOrder = document.getElementById('inputOrder');
        const inputTooltip = document.getElementById('inputTooltip');

        const updatePlugin = () => {
            removePlugin();
            createPlugin({
                position: selectPosition.value,
                collapsed: selectCollapsed.value === 'true',
                order: Number(inputOrder.value),
                tooltip: inputTooltip.value,
            });
        };

        document.getElementById('removeButton').addEventListener('click', removePlugin);
        [selectPosition, selectCollapsed, inputOrder, inputTooltip]
            .forEach((ctrl) => ctrl.addEventListener('change', updatePlugin));

        updatePlugin();
    </script>
</body>

</html>
