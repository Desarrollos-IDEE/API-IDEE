<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>ShareMap TEST</title>
    <link href="http://localhost:8080/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />
</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form" style="max-height: 13rem;">
            <div>
                <label for="selectPosition" title="Posición del plugin sobre el mapa. Por defecto: left">Posición "position"</label>
                <select name="position" id="selectPosition">
                    <option value="" selected="selected"></option>
                    <option value="left">Izquierda (left)</option>
                    <option value="right">Derecha (right)</option>
                </select>
            </div>
            <div>
                <label for="inputOrder"
                    title="Define en qué posición del panel debe aparecer en el conjunto de controles o plugins">Orden
                    entre controles / plugins "order"</label>
                <input type="number" name="order" id="inputOrder" value="1">
            </div>
            <div>
                <label for="inputTooltip" title="Texto del tooltip que aparece al pasar el ratón sobre el botón principal del plugin">Tooltip del botón del plugin "tooltip"</label>
                <input type="text" id="inputTooltip" list="tooltipSug">
                <datalist id="tooltipSug">
                    <option value="Compartir"></option>
                </datalist>
            </div>
            <div>
                <label for="inputBaseUrl"
                    title="URL base que se usará para construir el enlace compartido. Se emplea cuando urlAPI es true">URL
                    base "baseUrl"</label>
                <input type="text" id="inputBaseUrl" list="baseUrlSug">
                <datalist id="baseUrlSug">
                    <option value="https://componentes.idee.es/api-idee/"></option>
                    <option value="https://componentes-desarrollo.idee.es/api-idee/"></option>
                    <option value="https://componentes-beta.idee.es/api-idee/"></option>
                    <option value="http://localhost:8080/api-idee/"></option>
                </datalist>
            </div>
            <div>
                <label for="selectUrlAPI"
                    title="Controla si se usa baseUrl (true) o la URL actual del visor (false) para generar el enlace compartido. Por defecto: false">Usar
                    URL de API "urlAPI"</label>
                <select name="urlAPI" id="selectUrlAPI">
                    <option value=""></option>
                    <option value="true">true</option>
                    <option value="false" selected="selected">false</option>
                </select>
            </div>
            <div>
                <label for="selectMinimize"
                    title="Solo actúa cuando urlAPI es true. Genera una URL minimizada (true) o en formato estándar (false). Por defecto: false">URL
                    minimizada "minimize"</label>
                <select name="minimize" id="selectMinimize">
                    <option value=""></option>
                    <option value="true">true</option>
                    <option value="false" selected="selected">false</option>
                </select>
            </div>
            <div>
                <label for="inputTitle"
                    title="Título primario del modal">Título principal del modal "title"</label>
                <input type="text" id="inputTitle" list="titleSug">
                <datalist id="titleSug">
                    <option value="Compartir URL"></option>
                </datalist>
            </div>
            <div>
                <label for="inputText"
                    title="Texto que aparece como título de la sección de HTML embebido en el panel del plugin">Título
                    secundario del modal "text"</label>
                <input type="text" id="inputText" list="textSug">
                <datalist id="textSug">
                    <option value="HTML embebido"></option>
                </datalist>
            </div>
            <div>
                <label for="selectShareLayer"
                    title="Solo actúa cuando urlAPI es false. Incluye en el enlace todas las capas presentes en el mapa (true) o ninguna (false). Por defecto: false">Compartir
                    capas "shareLayer"</label>
                <select name="shareLayer" id="selectShareLayer">
                    <option value=""></option>
                    <option value="true">true</option>
                    <option value="false" selected="selected">false</option>
                </select>
            </div>
            <div>
                <label for="inputFilterLayers"
                    title="Lista de nombres de capas (separados por coma) que se incluirán en el enlace. Solo aplica cuando shareLayer es false o no está definido">Filtro
                    de capas "filterLayers"</label>
                <input type="text" id="inputFilterLayers" list="filterLayersSug">
                <datalist id="filterLayersSug">
                    <option value="cosas1_poligono"></option>
                    <option value="cosas1_poligono,Capa KML"></option>
                </datalist>
            </div>
            <div>
                <label for="inputBtn"
                    title="Texto del botón que cierra el panel del plugin">Texto del botón
                    cerrar "btn"</label>
                <input type="text" id="inputBtn" list="btnSug">
                <datalist id="btnSug">
                    <option value="OK"></option>
                    <option value="Aceptar"></option>
                    <option value="Cerrar"></option>
                </datalist>
            </div>
            <div>
                <label for="inputCopyBtn"
                    title="Texto del botón que copia la URL compartida al portapapeles">Botón
                    copiar URL "copyBtn"</label>
                <input type="text" id="inputCopyBtn" list="copyBtnSug">
                <datalist id="copyBtnSug">
                    <option value="Copiar"></option>
                    <option value="Copiar URL"></option>
                </datalist>
            </div>
            <div>
                <label for="inputCopyBtnHtml"
                    title="Texto del botón que copia el código HTML embebido al portapapeles">Botón
                    copiar HTML "copyBtnHtml"</label>
                <input type="text" id="inputCopyBtnHtml" list="copyBtnHtmlSug">
                <datalist id="copyBtnHtmlSug">
                    <option value="Copiar"></option>
                    <option value="Copiar HTML"></option>
                </datalist>
            </div>
            <div>
                <label for="inputTooltipCopy"
                    title="Mensaje que aparece como notificación emergente cuando se copia la URL o el HTML">Mensaje
                    de confirmación "tooltipCopy"</label>
                <input type="text" id="inputTooltipCopy" list="tooltipCopySug">
                <datalist id="tooltipCopySug">
                    <option value="¡Copiado!"></option>
                    <option value="Copiado al portapapeles"></option>
                </datalist>
            </div>
            <div>
                <label for="inputQrImage"
                    title="URL de la imagen que se muestra en el centro del código QR. Por defecto: el logo de IDEE">Imagen
                    del QR "qrImage"</label>
                <input type="text" id="inputQrImage" list="qrImageSug">
                <datalist id="qrImageSug">
                    <option value="https://componentes.idee.es/estaticos/imagenes/logos/API_IDEE/API_2/API_2.svg"></option>
                </datalist>
            </div>
            <div>
                <label for="selectOverwriteStyles"
                    title="Controla si se aplican los colores personalizados definidos en styles (true) o se mantienen los estilos por defecto (false). Por defecto: false">Sobreescribir
                    estilos "overwriteStyles"</label>
                <select name="overwriteStyles" id="selectOverwriteStyles">
                    <option value=""></option>
                    <option value="true">true</option>
                    <option value="false" selected="selected">false</option>
                </select>
            </div>
            <div>
                <label for="inputPrimaryColor"
                    title="Color primario del plugin: botón de apertura, caja y botones internos. Requiere overwriteStyles=true">Color
                    primario "styles.primaryColor"</label>
                <input type="color" id="inputPrimaryColor" value="#71a7d3">
            </div>
            <div>
                <label for="inputSecondaryColor"
                    title="Color secundario del plugin: fondo del panel abierto e imagen interior del botón. Requiere overwriteStyles=true">Color
                    secundario "styles.secondaryColor"</label>
                <input type="color" id="inputSecondaryColor" value="#ffffff">
            </div>
        </div>
        <div class="m-test-buttons">
            <button name="eliminar" class="m-test-button" id="removeButton">Eliminar Plugin</button>
        </div>
    </div>

    <div id="mapjs" class="container"></div>
    <script type="text/javascript" src="http://localhost:8080/api-idee/js/apiidee.ol.min.js"></script>
    <script type="text/javascript" src="http://localhost:8080/api-idee/js/configuration.js"></script>
    <script type="text/javascript" src="/main.js"></script>
</body>

</html>
