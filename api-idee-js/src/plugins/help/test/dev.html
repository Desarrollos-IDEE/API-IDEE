<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>Help TEST</title>
    <link href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />
    <style rel="stylesheet">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
    </style>

</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form" style="max-height: 13rem;">
            <div>
                <label for="selectPosition" title="Posición del plugin sobre el mapa. Por defecto: right">Posición
                    "position"</label>
                <select name="position" id="selectPosition">
                    <option value="left">Izquierda (left)</option>
                    <option value="right" selected="selected">Derecha (right)</option>
                    <option value="center-top-left">Arriba centro izquierda</option>
                    <option value="center-top-right">Arriba centro derecha</option>
                    <option value="center-bottom-left">Abajo centro izquierda</option>
                    <option value="center-bottom-right">Abajo centro derecha</option>
                    <option value="down">Abajo</option>
                </select>
            </div>
            <div>
                <label for="inputOrder"
                    title="Define en qué posición debe aparecer en el conjunto de controles o plugins">Orden entre
                    controles / plugins "order"</label>
                <input type="number" name="order" id="inputOrder" value="0">
            </div>
            <div>
                <label for="inputTooltip" title="Texto del tooltip que aparece al pasar el ratón sobre el botón">Tooltip
                    "tooltip"</label>
                <input type="text" id="inputTooltip" value="Ayuda">
            </div>
            <div>
                <label for="selectExtend"
                    title="Extiende el contenido inicial con información de API-IDEE. Por defecto: true">Extender
                    contenido inicial "extendInitialExtraContents"</label>
                <select name="extendInitialExtraContents" id="selectExtend">
                    <option value="true" selected="selected">true</option>
                    <option value="false">false</option>
                </select>
            </div>
            <div>
                <label for="inputInitialIndex" title="Índice de sección a mostrar al abrir">Índice inicial
                    "initialIndex"</label>
                <input type="number" name="initialIndex" id="inputInitialIndex" value="0" min="0">
            </div>
            <div>
                <label for="inputHeaderTitle" title="Título de la cabecera de la página de ayuda (header.title)">Título
                    cabecera
                    "header.title"</label>
                <input type="text" id="inputHeaderTitle" value="Título definido por el usuario">
            </div>
            <div>
                <label for="textareaHeaderImages"
                    title="URLs de imágenes de cabecera separadas por coma (header.images)">Imágenes cabecera
                    "header.images"</label>
                <textarea name="headerImages" id="textareaHeaderImages" cols="30"
                    rows="3">https://www.gravatar.com/avatar/586252adace7084ee98aa8977fe5cc2b?rating=PG&amp;size=128&amp;default=wavatar, https://www.gravatar.com/avatar/75df827b1b67c5f04f1715dd01016735?rating=PG&amp;size=64x64&amp;default=wavatar</textarea>
            </div>
        </div>
        <div class="m-test-buttons">
            <button name="eliminar" class="m-test-button" id="removeButton">Eliminar Plugin</button>
        </div>
    </div>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>
    <script type="text/javascript" src="/main.js"></script>
</body>

</html>
