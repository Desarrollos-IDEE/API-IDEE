<div id="m-layerswitcher-style">
    <div tabindex="0" class="m-layerswitcher-style-container">
        <select tabindex="0" id="m-layerswitcher-style-select">
            <option disabled="disabled" value="" {{#unless hasActive}}selected="selected"{{/unless}}>{{translations.select_style}}</option>
            {{#each options}}
                <option value="{{value}}" data-unsupported="{{unsupported}}" {{#if selected}}selected="selected"{{/if}}>{{label}}</option>
            {{/each}}
        </select>
    </div>
    <p class="m-layerswitcher-style-notice" aria-live="polite" hidden></p>
    <div class="m-layerswitcher-style-btn-container">
        <button tabindex="0" class="m-layerswitcher-style-change-button">{{translations.change}}</button>
    </div>
</div>
