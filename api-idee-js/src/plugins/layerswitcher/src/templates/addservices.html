<div class="m-layerswitcher-addservices">
    <div class="m-layerswitcher-search-panel">
        <div class="m-layerswitcher-input-container">
            <div class="m-layerswitcher-input-container-buttons">
                <button tabindex="0" id="m-layerswitcher-addservices-search-btn" class="secondary g-cartografia-btn-layerswitcher-zoom m-search-btn" title="{{translations.query}}"></button>
                <button tabindex="0" id="m-layerswitcher-layerGroup" class="secondary g-cartografia-btn-layerswitcher-group m-search-btn" title="{{translations.group}}"></button>
                <!--<button tabindex="0" id="m-layerswitcher-addservices-fileurl-btn" class="m-layerswitcher-icons-doc-text m-search-btn" title="{{translations.query}}"></button>-->
                {{#if codsiActive}}
                    <button tabindex="0" role="button" id="m-layerswitcher-addservices-codsi-btn" class="secondary g-cartografia-btn-layerswitcher-codsi m-search-btn" title="{{translations.codsi_services}}"></button>
                {{/if}}

                {{#if hasPrecharged}}
                    <button tabindex="0" role="button" id="m-layerswitcher-addservices-list-btn" class="secondary g-cartografia-btn-layerswitcher-lista m-search-btn" title="{{translations.loaded_services}}"></button>
                {{/if}}
                <button tabindex="0" id="labelFileInput" class="secondary g-cartografia-btn-layerswitcher-upload" title="{{translations.upload_file}}" onclick="document.getElementById('m-layerswitcher-addservices-file-input').click()"></button>
                <input tabindex="0" type="file" id="m-layerswitcher-addservices-file-input" accept="{{accept}}" style="display: none;">
            </div>
            <input tabindex="0" type="text" id="m-layerswitcher-addservices-search-input" placeholder="{{translations.url_service}}" class="m-layerswitcher-input-search" />
        </div>
        <div id="m-layerswitcher-ogc-mode" class="m-layerswitcher-ogc-mode" style="display: none;"></div>
        <div id="m-layerswitcher-ogcCContainer"></div>
        <div id="m-layerswitcher-layerContainer"></div>
    </div>
    <div id="m-layerswitcher-addservices-suggestions" class="m-layerswitcher-addservices-suggestions">
        <table>
            {{#if precharged}}
            <thead>
                <tr>
                    <th tabindex="0">{{translations.availables}}</th>
                </tr>
            </thead>
            {{/if}}
            <tbody>
                {{#each precharged.groups}}
                    <tr>
                        <td>
                            <button tabindex="0" role="button" class="m-layerswitcher-suggestion-caret g-cartografia-btn-layerswitcher-caret">{{name}}</button>
                            <ul class="m-layerswitcher-suggestion-group">
                                {{#each services}}
                                    <li><button tabindex="0" class="m-layerswitcher-suggestion" data-service-type="{{type}}" data-link="{{url}}">{{name}}</button></li>
                                {{/each}}
                            </ul>
                        </td>
                    </tr>
                {{/each}}
                {{#each precharged.services}}
                    <tr>
                        <td><button tabindex="0" class="m-layerswitcher-suggestion" data-service-type="{{type}}" data-link="{{url}}">{{name}}</button></td>
                    </tr>
                {{/each}}
            </tbody>
        </table>
    </div>

    <div id="m-layerswitcher-addservices-codsi"  style="display: none;">
        <p class="m-layerswitcher-addservices-codsi-link"><a tabindex="0" href="https://www.idee.es/csw-inspire-idee/srv/spa/catalog.search#/home" target="_blank">{{translations.codsi_services}}</a></p>
        <div class="m-layerswitcher-addservices-codsi-search-panel">
            <input tabindex="0" type="text" id="m-layerswitcher-addservices-codsi-search-input" placeholder="{{translations.filter_text}}" class="m-input-search" />
            <span tabindex="0" role="button" id="m-layerswitcher-addservices-codsi-filter-btn" class="g-cartografia-btn-layerswitcher-zoom m-filter-btn" title="{{translations.filter_results}}"></span>
            <span tabindex="0" role="button" id="m-layerswitcher-addservices-codsi-clean-btn" class="m-layerswitcher-icons-papelera m-clean-btn" title="{{translations.clean_filter}}"></span>
        </div>
        <div>
            <table>
                <tbody id="m-layerswitcher-addservices-codsi-results" class="m-layerswitcher-catalog-results"></tbody>
            </table>
        </div>
        <div id="m-layerswitcher-addservices-codsi-pagination" class="m-layerswitcher-pagination">
        </div>
    </div>
    <div id="m-layerswitcher-addservices-results"></div>
</div>
