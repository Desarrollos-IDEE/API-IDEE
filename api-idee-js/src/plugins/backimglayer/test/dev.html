<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <title>BackImgLayer TEST</title>
    <link href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />
    <link href="https://componentes-beta.idee.es/api-idee/plugins/information/information.ol.min.css" rel="stylesheet" />
    <link href="https://componentes-beta.idee.es/api-idee/plugins/vectors/vectors.ol.min.css" rel="stylesheet" />

    <link href="https://componentes-beta.idee.es/api-idee/plugins/vectorsmanagement/vectorsmanagement.ol.min.css" rel="stylesheet" />
    
</head>

<body>
    <div class="m-api-idee-test-form-frame">
        <div class="m-test-form">
            <div>
                <label for="selectPosicion" title="Posición del Plugin / Control">Posición "position"</label>
                <select name="position" id="selectPosicion">
                    <option value="left">Izquierda</option>
                    <option value="right" selected="selected">Derecha</option>
                </select>
            </div>
            <div>
                <label for="inputTooltip">Título de la Herramienta "tooltip"</label>
                <input type="text" name="tooltip" id="inputTooltip" list="tooltipSug" value="Capas de fondo">
                <datalist id="tooltipSug">
                    <option value="Capas de fondo"></option>
                </datalist>
            </div>
            <div>
                <label for="inputOrder"
                    title="Define en que posición del panel debe aparecer en el conjunto de controles o plugins">Orden
                    entre controles / plugins "order"</label>
                <input type="number" name="order" id="inputOrder" list="orderSug" value="-1">
            </div>
            <div>
                <label for="ncolumn"
                    title="Número de columnas que tendrá el UI de capas, el valor mínimo deberá ser 1 o superior">Número
                    de columnas "columnsNumber"</label>
                <input type="number" id="ncolumn" name="ncolumn" value="1" min="1">
            </div>
            <div>
                <label for="selectCollapsed" title="Muestra el panel desplegado o colapsado">Colapsado
                    "collapsed"</label>
                <select name="httpValue" id="selectCollapsed">
                    <option value=true>true</option>
                    <option value=false>false</option>
                </select>
            </div>
            <div>
                <label for="selectVisibility">Capas visibles "layerVisibility"</label>
                <select name="httpValue" id="selectVisibility">
                    <option value=true>true</option>
                    <option value=false>false</option>
                </select>
            </div>
            <div>
                <label for="selectEmpty" title="Opción de selección sin capa base">Seleccionar sin capa "empty"</label>
                <select name="empty" id="selectEmpty">
                    <option value=true>true</option>
                    <option value=false selected="selected">false</option>
                </select>
            </div>
            <div>
                <label for="selectEnableLayerOpts"
                    title="Esta opción deshabilita el uso de 'ids', 'previews' y 'layers', cargando una configuración completa">Precarga
                    de capas "layerOpts"</label>
                <select name="empty" id="selectEnableLayerOpts">
                    <option value=true selected="selected">true</option>
                    <option value=false>false</option>
                </select>
            </div>
            <div>
                <label for="inputIds"
                    title="Títulos de las capas, pasadas por parametros, tienen efecto cuando layerOpts no está activo">Ids
                    de capas "ids"</label>
                <input type="text" name="ids" id="inputIds" list="idsSug" value="mapa,hibrido">
                <datalist id="idsSug">
                    <option value="mapa,hibrido"></option>
                </datalist>
            </div>
            <div>
                <label for="inputTitles"
                    title="Títulos de las capas, pasadas por parametros, tienen efecto cuando layerOpts no está activo">Títulos
                    de las capas "titles"</label>
                <input type="text" name="titles" id="inputTitles" list="titlesSug" value="Mapa,Hibrido">
                <datalist id="titlesSug">
                    <option value="Mapa,Hibrido"></option>
                </datalist>
            </div>
            <div>
                <label for="inputPreviews"
                    title="Enlaces a las vistas de las capas cargadas, tienen efecto cuando layerOpts no está activo">Vistas
                    de las capas "previews"</label>
                <input type="text" name="previews" id="inputPreviews" list="previewsSug" value="plugins/backimglayer/images/svqmapa.png,plugins/backimglayer/images/svqimagen.png">
                <datalist id="previewsSug">
                    <option value="plugins/backimglayer/images/svqmapa.png,plugins/backimglayer/images/svqimagen.png"></option>
                </datalist>
            </div>
            <div>
                <label for="inputLayers"
                    title="Campo capas, funcionan con ids y previews para cargar cada capa con su apariencia, tienen efecto cuando layerOpts no está activo">Capas
                    por parámetro "layers"</label>
                <input type="text" name="layers" id="inputLayers" list="layersSug" value="WMTS*https://www.ign.es/wmts/ign-base?*IGNBaseTodo*GoogleMapsCompatible*Mapa IGN*false*image/jpeg*false*false*true,WMTS*https://www.ign.es/wmts/pnoa-ma?*OI.OrthoimageCoverage*GoogleMapsCompatible*Imagen (PNOA)*false*image/png*false*false*true"">
                <datalist id="layersSug">
                    <option value="WMTS*https://www.ign.es/wmts/ign-base?*IGNBaseTodo*GoogleMapsCompatible*Mapa IGN*false*image/jpeg*false*false*true,WMTS*https://www.ign.es/wmts/pnoa-ma?*OI.OrthoimageCoverage*GoogleMapsCompatible*Imagen (PNOA)*false*image/png*false*false*true"></option>
                </datalist>
            </div>
        </div>
        <div class="m-test-buttons">
            <button name="eliminar" class="m-test-button" id="removeButton">Eliminar Plugin</button>
        </div>
    </div>

    <div id="mapjs" class="container"></div>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/plugins/information/information.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/plugins/vectors/vectors.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/plugins/vectorsmanagement/vectorsmanagement.ol.min.js"></script>
    <script type="text/javascript" src="/main.js"></script>
</body>

</html>
