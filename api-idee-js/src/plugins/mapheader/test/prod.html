<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="api-idee" content="yes">
    <title>Mapheader Production TEST</title>
    <link href="https://componentes-beta.idee.es/api-idee/assets/css/apiidee.ol.min.css" rel="stylesheet" />
    <link href="https://componentes-beta.idee.es/api-idee/plugins/help/help.ol.min.css" rel="stylesheet" />
    <link href="../dist/mapheader.ol.min.css" rel="stylesheet" />
    <style rel="stylesheet">
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <div id="mapjs" class="container"></div>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/apiidee.ol.min.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/js/configuration.js"></script>
    <script type="text/javascript" src="https://componentes-beta.idee.es/api-idee/plugins/help/help.ol.min.js"></script>
    <script type="text/javascript" src="../dist/mapheader.ol.min.js"></script>
    <script>
        const map = IDEE.map({
            container: 'mapjs',
        });
        map.addControls(['scaleline']);
        const mp = new IDEE.plugin.Mapheader({
            position: 'center-top-left',
            collapsed: false,
            order: 0,
            tooltip: 'Mapheader',
            htmlCode: `
<header>
<div id="header-pc">
  <div class="col-12">
    <div class="col-3 marginTop20px">
      <a href="https://www.ign.es" target="_blank" title="Instituto Geográfico Nacional y O. A. Centro Nacional de Información Geográfica">
      <img src="https://centrodedescargas.cnig.es/CentroDescargas/imgCdD/escudoInstitucional.png" alt="Instituto Geográfico Nacional y O. A. Centro Nacional de Información Geográfica" class="img-fluid imgMinisterio "></a>
    </div>
    <div class="col-6 col-m-12 marginTop20px">
      <div class="col-12 txtCenter"><a href="https://centrodedescargas.cnig.es/CentroDescargas/home" class="txtSupCdDCabenlace" title="Centro de Descargas">Centro de Descargas</a></div>
      <div class="marginTop10px col-12 colorVerdeClaro txtCenter paddingBottom10px">Instituto Geográfico Nacional</div>
      <div class="col-12 colorVerdeClaro txtCenter">Organismo Autónomo Centro Nacional de Información Geográfica</div>
    </div>
  </div>
</div>
</header>
            `,
        });
        map.addPlugin(mp);
        try {
            map.addPlugin(new IDEE.plugin.Help({}));
        } catch (err) {
            // Help opcional
        }
    </script>
</body>

</html>
