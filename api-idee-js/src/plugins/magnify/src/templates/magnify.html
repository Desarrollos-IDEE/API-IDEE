<div class="m-magnify-container">
    <div id="m-magnify-titulo" class="title">{{translations.title}}</div>
    <div class="m-magnify-panel">
        <div class="m-magnify-effect-buttoms">
            <button id="m-magnify-magnifying"
                class="m-magnify-btn big-buttom g-cartografia-btn-magnify-zoom"
                type="button"
                title="{{translations.actmagnifier}}"
                aria-label="{{translations.actmagnifier}}"></button>
        </div>
        <div class="m-magnify-zoom-offset">
            <p>{{translations.zoomlevel}}</p>
            <input type="number" min="1" max="{{zoomMax}}" step="0.5" class="m-magnify-zoom-offset-input" id="input-zoom-offset"></input>
        </div>
    </div>
</div>
