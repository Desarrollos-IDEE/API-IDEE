<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edición espacial DataIDEE</title>
    <link rel="stylesheet" href="/assets/apiidee.css">
    <link rel="stylesheet" href="/assets/vectorsmanagement.css">
    <style>
      html, body, #map { width: 100%; height: 100%; margin: 0; }
      .demo-mode { position: absolute; z-index: 30000; top: 1rem; left: 1rem; padding: .6rem; background: white; }
      .demo-mode label { margin-right: .5rem; }
    </style>
  </head>
  <body>
    <div class="demo-mode">
      <label for="demo-mode">Servicio</label>
      <select id="demo-mode">
        <option value="local">Local (escritura disponible)</option>
        <option value="readonly">Local (solo lectura)</option>
        <option value="dense">Local (zona que supera entidades)</option>
        <option value="complex">Local (geometría que supera coordenadas)</option>
        <option value="conflict">Local (conflicto al guardar)</option>
        <option value="partial">Local (fallo tras un éxito)</option>
        <option value="write-error">Local (validación rechazada)</option>
        <option value="uncertain">Local (respuesta de escritura incierta)</option>
        <option value="teunesco-farmacias">TEUNESCO (farmacias)</option>
        <option value="teunesco-rutas">TEUNESCO (rutas EuroVelo)</option>
        <option value="teunesco-terminos">TEUNESCO (términos municipales)</option>
      </select>
      <span id="demo-status" role="status" aria-live="polite"></span>
    </div>
    <div id="map"></div>
    <script src="/assets/apiidee.js"></script>
    <script src="/assets/configuration.js"></script>
    <script src="/assets/vectorsmanagement.js"></script>
    <script src="/demo.js"></script>
  </body>
</html>
