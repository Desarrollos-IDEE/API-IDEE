<div>
    <div class="m-catalogmanager-items-buttons">
        <button class="m-catalogmanager-prev-items-button" {{#if hasNotPrev}}disabled{{/if}} title="{{translations.previous}}"><span class="g-cartografia-catalog-left-big m-catalogmanager-prev-items-button"></span></button>
        <span class="m-catalogmanager-items-page">{{translations.pagination}}</span>
        <button class="m-catalogmanager-next-items-button" {{#if hasNotNext}}disabled{{/if}} title="{{translations.next}}"><span class="g-cartografia-catalog-right-big m-catalogmanager-next-items-button"></span></button>
    </div>
    <h3 class="m-catalogmanager-section-title no-event">
        {{collectionTitle}}
        <button class="m-catalogmanager-info-button action-btn" title="{{translations.metadata}}"><span class="g-cartografia-catalog-info m-catalogmanager-info-button"></span></button>
        {{#if downloadable}}<button class="m-catalogmanager-download-button action-btn" title="{{translations.download}}"><span class="g-cartografia-catalog-download m-catalogmanager-download-button"></span></button>{{/if}}
    </h3>
    <ul class="m-catalogmanager-ulitems">
        {{#if downloadable}}
        <li tabindex="0" class="m-catalogmanager-sectionPanel">
            <div>
                <div class="m-catalogmanager-visible-typeContent">
                    <div style="display: flex;gap: 0.5rem;">
                        <div>
                            <input type="checkbox" class="m-catalogmanager-checkbox-item" id="select-all-items">
                        </div>
                        <div>
                            <span class="m-catalogmanager-title-box" tabindex="0">Seleccionar todo</span>
                        </div>
                    </div>
                </div>
            </div>
        </li>
        {{/if}}
        {{#each items}}
            <li tabindex="0" class="m-catalogmanager-sectionPanel">
                <div id="item-{{id}}" class="m-catalogmanager-title-item"
                    data-item-name="{{title}}" data-item-id="{{id}}" data-catalog-index="{{catalogIndex}}" data-collection-index="{{collectionIndex}}">
                    <div class="m-catalogmanager-visible-typeContent">
                        <table style="width: 100%;">
                            <tbody>
                                <tr>
                                    <td style="text-align: start;">
                                        <span class="g-cartografia-catalog-down-open m-catalogmanager-icon"></span>
                                    </td>
                                    {{#if ../downloadable}}
                                    <td>
                                        <input type="checkbox" class="m-catalogmanager-checkbox-item" {{#if selected}}checked{{/if}}
                                        data-item-name="{{title}}" data-item-id="{{id}}" data-catalog-index="{{catalogIndex}}" data-collection-index="{{collectionIndex}}">
                                    </td>
                                    {{/if}}
                                    <td><span class="m-catalogmanager-title-box"  
                                            title="{{id}}" tabindex="0">
                                            {{id}}
                                        </span>
                                    </td>
                                    <td style="text-align: end;">
                                        <button class="m-catalogmanager-info-button action-btn" title="{{../translations.metadata}}"><span class="g-cartografia-catalog-info m-catalogmanager-info-button"></span></button>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="m-catalogmanager-images item-{{id}} hidden empty"></div>
            </li>
        {{/each}}
    </ul>
</div>
