<div class="m-catalogmanager-logincatalog">
    <div class="m-catalogmanager-add-panel">
        <div class="form-container">
            <div class="form-row">
                <label for="m-catalogmanager-user">{{translations.cat_user}}</label>
                <input id="m-catalogmanager-user" type="text" placeholder="{{translations.cat_user}}">
            </div>
            <div class="form-row">
                <label for="m-catalogmanager-password">{{translations.cat_password}}</label>
                <input id="m-catalogmanager-password" type="password" placeholder="{{translations.cat_password}}">
            </div>
            <div class="form-row flex-reverse">
                <button id="m-catalogmanager-login-public" class="dialog-btn">{{translations.publicUser}}</button>
                <button id="m-catalogmanager-login-catalog" class="dialog-btn">{{translations.login}}</button>
            </div>
        </div>
    </div>
</div>
