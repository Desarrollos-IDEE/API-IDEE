<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="idee" content="yes">
    <link rel="stylesheet" type="text/css" href="../../../dist/assets/css/apiidee.cesium.min.css">
    <title>PRUEBA PLAYWRIGHT</title>
    <style rel="stylesheet">
      html,
      body {
          margin: 0;
          padding: 0;
          height: 100%;
          overflow: auto;
      }

      .makidentist:before {
          content: '\e814';
          color: 'red'
      }
    </style>
  </head>
  <body>
    <div id="map" class="container"></div>
    <script src="../../../dist/js/apiidee.cesium.min.js" charset="utf-8"></script>
    <script src="../../../test/configuration_filtered.js" charset="utf-8"></script>
    <script type="text/javascript">
      // Sin GPU, Cesium pinta por software a la frecuencia de la pantalla y, en máquinas con
      // pocas CPU (el agente de Jenkins tiene 2), deja al navegador sin tiempo para lo demás.
      // Las pruebas no necesitan esa frecuencia: se limita en todos los mapas de la página.
      (() => {
        const createMap = IDEE.map;
        IDEE.map = (parameters, options, viewOptions) => createMap(parameters, options, {
          targetFrameRate: 15, ...viewOptions,
        });
      })();
    </script>
  </body>
</html>
