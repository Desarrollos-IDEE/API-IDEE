<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="idee" content="yes">

  <title>Ejemplos IDEE.style.Raster</title>
  <style rel="stylesheet">
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    #examples-panel {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 340px;
      max-height: calc(100vh - 20px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.96);
      padding: 12px 14px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    #examples-panel h2 {
      margin: 0 0 6px;
      font-size: 15px;
    }

    #examples-panel .intro {
      margin: 0 0 12px;
      color: #444;
      line-height: 1.4;
    }

    #examples-panel fieldset {
      border: 1px solid #ddd;
      border-radius: 4px;
      margin: 0 0 10px;
      padding: 8px 10px;
    }

    #examples-panel legend {
      font-weight: bold;
      padding: 0 4px;
    }

    #examples-panel button {
      display: block;
      width: 100%;
      margin: 0 0 6px;
      padding: 7px 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #f7f7f7;
      cursor: pointer;
      text-align: left;
      font-size: 12px;
    }

    #examples-panel button:hover {
      background: #ececec;
    }

    #examples-panel button.active {
      border-color: #2a6fdb;
      background: #e8f0fe;
      font-weight: bold;
    }

    #examples-panel button:last-child {
      margin-bottom: 0;
    }

    #description {
      margin-top: 4px;
      padding: 10px;
      background: #f4f6f8;
      border-radius: 4px;
      line-height: 1.45;
      color: #222;
      white-space: pre-wrap;
    }

    #description strong {
      display: block;
      margin-bottom: 4px;
      font-size: 13px;
    }

    #legend {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
    }

    #legend.hidden {
      display: none;
    }

    #legend img {
      display: block;
      margin-top: 6px;
      max-width: 220px;
      height: auto;
    }

    .note {
      margin: 8px 0 0;
      color: #666;
      font-size: 11px;
      line-height: 1.35;
    }
  </style>
</head>

<body>
  <div id="map" class="map"></div>

  <aside id="examples-panel">
    <h2>IDEE.style.Raster</h2>
    <p class="intro">
      Ejemplos sencillos, cada uno por separado.
      Pulsa un botón para aplicar ese estilo a la capa GeoTIFF.
    </p>

    <fieldset>
      <legend>Base</legend>
      <button type="button" data-example="none">Sin estilo</button>
    </fieldset>

    <fieldset>
      <legend>Filtros WebGL</legend>
      <button type="button" data-example="saturation">Saturación</button>
      <button type="button" data-example="gamma">Gamma</button>
      <button type="button" data-example="brightness">Brillo</button>
      <button type="button" data-example="contrast">Contraste</button>
      <button type="button" data-example="exposure">Exposición</button>
      <button type="button" data-example="filters-all">Todos los filtros</button>
    </fieldset>

    <fieldset>
      <legend>Rampa</legend>
      <button type="button" data-example="monoband">Monobanda + rampa</button>
      <button type="button" data-example="bands-mean">Media de bandas + rampa</button>
      <button type="button" data-example="interpolation">Interpolación exponencial</button>
      <button type="button" data-example="nodata">Nodata + rampa</button>
    </fieldset>

    <fieldset>
      <legend>Índices espectrales</legend>
      <button type="button" data-example="ndvi">NDVI</button>
      <button type="button" data-example="ndwi">NDWI</button>
      <button type="button" data-example="nbr">NBR</button>
    </fieldset>

    <div id="description">
      <strong>Elige un ejemplo</strong>
      La descripción y el código del estilo aparecerán aquí.
    </div>
    <p class="note">
    </p>
  </aside>

  <div id="legend" class="hidden">
    <div>Leyenda (rampa)</div>
    <img id="legend-img" alt="Leyenda de la rampa" />
  </div>

  <script src="/config.js" charset="utf-8"></script>
  <script src="/style-raster-examples.js" charset="utf-8"></script>
</body>

</html>
