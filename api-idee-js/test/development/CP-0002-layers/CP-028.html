<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="idee" content="yes">
    <title>GeoPackage desde LayerSwitcher</title>
    <link rel="stylesheet" href="/dist/assets/css/apiidee.ol.min.css">
    <link rel="stylesheet" href="/src/plugins/layerswitcher/dist/layerswitcher.ol.min.css">
    <style>
      html, body, #map { margin: 0; width: 100%; height: 100%; }
      body { font-family: sans-serif; }
      .instructions {
        position: absolute;
        z-index: 1;
        top: 12px;
        left: 12px;
        box-sizing: border-box;
        width: min(340px, calc(100% - 24px));
        padding: 12px 16px;
        border-radius: 4px;
        background: rgb(255 255 255 / 94%);
        box-shadow: 0 1px 5px rgb(0 0 0 / 30%);
        color: #222;
      }
      .instructions h1 { margin: 0 0 8px; font-size: 1.2rem; }
      .instructions p { margin: 6px 0; }
      .instructions code { overflow-wrap: anywhere; }
      #layerswitcher-add-layer {
        min-height: 40px;
        border: 2px solid var(--idee-color-primary, #006699);
        border-radius: 2px;
        background: var(--idee-color-primary, #006699);
        color: #fff;
        font-weight: 600;
      }
      #layerswitcher-add-layer:hover { filter: brightness(0.9); }
      #layerswitcher-add-layer:focus-visible {
        outline: 3px solid #ffbf47;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="map" role="region" aria-label="Mapa de prueba de GeoPackage con LayerSwitcher"></div>
    <aside class="instructions" aria-label="Instrucciones de la prueba">
      <h1>GeoPackage con LayerSwitcher</h1>
      <p>Abre <strong>Gestor de capas</strong>, pulsa el botón azul <strong>Cargar capas</strong> situado en la parte superior del panel y selecciona un archivo <code>.gpkg</code> o introduce su URL.</p>
      <p>Al finalizar, las tablas vectoriales y ráster deben aparecer tanto en el mapa como en el listado del gestor.</p>
    </aside>
    <script src="/dist/js/apiidee.ol.min.js" charset="utf-8"></script>
    <script src="/config.js" charset="utf-8"></script>
    <script src="/src/plugins/layerswitcher/dist/layerswitcher.ol.min.js" charset="utf-8"></script>
    <script src="/CP-0002-layers/CP-028.js" charset="utf-8"></script>
  </body>
</html>
